[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clont"
dynamic = ["version"]
description = "A long-running, strictly read-only monitoring and FinOps agent for the cloud"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["monitoring", "observability", "agent", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12",
    "boto3>=1.34",
    "pydantic-settings[yaml]>=2.2",
]

[project.scripts]
clont = "clont.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[ec2,s3,sts]>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/clont-app/clont"
Repository = "https://github.com/clont-app/clont"

[tool.hatch.version]
path = "clont/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["clont"]

[tool.hatch.build.targets.sdist]
include = ["clont", "README.md", "LICENSE"]