{{- if .Values.rbac.create }}
{{/* exactly what a kubernetes: source reads, nothing else */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clont.fullname" . }}
  labels:
    {{- include "clont.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clont.fullname" . }}
  labels:
    {{- include "clont.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clont.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "clont.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
