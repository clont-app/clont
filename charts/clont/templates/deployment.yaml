apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clont.fullname" . }}
  labels:
    {{- include "clont.labels" . | nindent 4 }}
spec:
  # one agent, and never two at once: a second replica would re-collect the same
  # accounts and notify twice on the same condition
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clont.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clont.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if eq (include "clont.configSource" .) "chart" }}
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "clont.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: clont
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          env:
            - name: CLONT_CONFIG
              value: /etc/clont/{{ .Values.configKey }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/clont
              readOnly: true
            # readOnlyRootFilesystem: the home dir and tmp still have to be writable
            - name: home
              mountPath: /var/lib/clont
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
        {{- if .Values.existingSecret }}
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0400
        {{- else }}
          configMap:
            name: {{ .Values.existingConfigMap | default (include "clont.fullname" .) }}
        {{- end }}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
