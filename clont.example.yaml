# clont configuration — copy to clont.yaml, or point $CLONT_CONFIG at this file.
# In Kubernetes this file becomes a ConfigMap mounted into the pod.
# Validated on startup; unknown keys are rejected.

interval_seconds: 300        # how often the agent runs a cycle
lookback_days: 1             # window for cost / metric queries
log_level: info              # daemon log verbosity: debug|info|warning|error|critical

# Read-only access to one or more AWS accounts, key is alias
# (prod/staging/...). The alias is shown in notifications and attributes events.
# On EKS the pod's base identity comes from IRSA; clont assumes each role.
aws:
  prod:
    role_arn: arn:aws:iam::111111111111:role/clont-readonly
    regions: [us-east-1, eu-west-1]
  staging:
    role_arn: arn:aws:iam::222222222222:role/clont-readonly
    regions: [us-east-1]

# FinOps. Spend events: a daily spend digest (info) every cycle, and a spend
# spike (warn) when a service's latest-day spend jumps over its baseline. The
# idle/snapshot thresholds tune the rightsizing/waste recommendations.
finops:
  spend_baseline_days: 28        # trailing window (~4 wks); spike baseline = same-weekday median
  spend_spike_pct: 50            # WARN when the latest day exceeds baseline by this %
  spend_min_dollars: 1           # ignore services below this latest-day spend
  idle_cpu_pct: 5                # avg CPU % below which a resource is idle
  idle_lookback_days: 14         # trailing window the idle averages span
  idle_rds_max_connections: 1    # avg DB connections below which RDS is idle
  snapshot_max_age_days: 90      # EBS snapshots older than this are "old"

channels:
  # Always on. Logs a new condition immediately, then re-logs a standing one
  # at most this often (so it isn't logged every cycle).
  log:
    repeat_hours: 3
    min_severity: info

  # Notification channels are optional. Omit `repeat_hours` to notify once per
  # condition; set it to re-notify a still-open condition on that interval.
  slack:
    webhook_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    min_severity: warn
    repeat_hours: 24

  discord:
    webhook_url: https://discord.com/api/webhooks/XXX/YYY
    min_severity: warn

  telegram:
    bot_token: "123456:ABC-DEF..."
    chat_id: "-1001234567890"
    min_severity: critical
